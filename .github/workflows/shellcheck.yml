name: shellcheck

# `bash -n` only checks syntax. It passed cleanly the whole time
# `source ~/.local/aliases/*` was silently loading just the first file, and it
# would pass on `ls --color=always` breaking pipes too. shellcheck catches that
# class of bug; this runs it so the next one gets caught before it is committed.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # Pinned rather than `apt install shellcheck`, so a GitHub runner-image bump
  # cannot change what this workflow enforces. Bumping is a deliberate commit:
  # change both values together and re-run the checks locally first.
  #
  # Note apt on Ubuntu 24.04 ships 0.9.0, so a local `apt install shellcheck`
  # will be a version behind CI. Both were verified against this repo and both
  # pass; if you want an exact local match, use the same tarball.
  SHELLCHECK_VERSION: v0.10.0
  SHELLCHECK_SHA256: 6c881ab0698e4e6ea235245f22832860544f17ba386442fe7e9d629f8cbedf87

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned shellcheck
        run: |
          set -euo pipefail
          url="https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl -fsSL --retry 3 -o shellcheck.tar.xz "$url"
          # Verify before extracting: this downloads and then executes a binary,
          # so an unverified tarball would be arbitrary code execution in CI.
          echo "${SHELLCHECK_SHA256}  shellcheck.tar.xz" | sha256sum -c -
          tar -xJf shellcheck.tar.xz
          install -m755 "shellcheck-${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          rm -rf shellcheck.tar.xz "shellcheck-${SHELLCHECK_VERSION}"
          shellcheck --version

      - name: Syntax check
        run: bash -n install.sh scripts/*.sh

      - name: Installer scripts
        run: shellcheck -x -S style install.sh scripts/*.sh

      # ~/.local/bin helpers. Selected by shebang, not by globbing the
      # directory: cellsize is Python, and shellcheck errors out rather than
      # skipping a file it cannot handle.
      - name: Local bin scripts
        run: |
          set -euo pipefail
          mapfile -t scripts < <(grep -rlE '^#!.*\bbash\b' common/.local/bin | sort)
          printf 'linting %s\n' "${scripts[@]}"
          bash -n "${scripts[@]}"
          shellcheck -x -S style "${scripts[@]}"

      # The rest of ~/.local/bin is Python, which shellcheck cannot read at all.
      # py_compile needs nothing installed and catches the syntax errors that
      # would otherwise only show up as a keybinding that silently does nothing.
      - name: Local bin python
        run: |
          set -euo pipefail
          mapfile -t py < <(grep -rlE '^#!.*python' common/.local/bin | sort)
          printf 'compiling %s\n' "${py[@]}"
          python3 -m py_compile "${py[@]}"

      # These are sourced, not executed, so shellcheck cannot infer the shell.
      - name: Bash config
        run: shellcheck -s bash -S style common/.bash_aliases common/.bash_functions

      # ~/.profile.d/*.sh is sourced by ~/.profile, which runs under /bin/sh on
      # login -- so these must stay POSIX, not bash.
      - name: POSIX profile scripts
        run: shellcheck -s sh -S style common/.profile.d/*.sh
