# --- General Settings ---
# enable mouse mode
set -g mouse on

# don't rename windows automatically
set-option -g allow-rename off

# --- Color / Rendering ---
# what tmux advertises INWARD to programs running in panes
set -g default-terminal "tmux-256color"

# what tmux believes about the OUTER terminal; key must match the outer $TERM
# (cosmic-term sets TERM=xterm-256color, kitty sets TERM=xterm-kitty). without
# RGB, tmux quantizes 24-bit color down to the nearest of 256 palette slots
# before writing out.
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-features ",xterm-kitty:RGB"

# undercurl + colored underlines (nvim diagnostics)
set -as terminal-features ",xterm-256color:usstyle"
set -as terminal-features ",xterm-kitty:usstyle"

# OSC 8 hyperlinks - lets `ls --hyperlink`, gh, and nvim emit clickable links
# instead of raw URLs. harmless if the outer terminal ignores them.
set -as terminal-features ",xterm-256color:hyperlinks"
set -as terminal-features ",xterm-kitty:hyperlinks"

# OSC 52 clipboard: a program inside a pane can set the SYSTEM clipboard through
# tmux, which is what makes yanking work over SSH where wl-copy does not exist.
set -g set-clipboard on

# let programs send escape sequences straight through tmux to the outer terminal
# (kitty graphics protocol, image.nvim, terminal notifications).
set -g allow-passthrough on

# pane borders are drawn with U+2502/U+2500 when the client is UTF-8. if they
# ever render as broken/stacked bars, that is the FONT: the box-drawing glyph is
# shorter than the terminal line box. fix the font, not this option. options are
# single (default) / double / heavy / simple / number / padded.
#set -g pane-border-lines heavy

# let nvim see FocusGained/FocusLost (autoread, etc.)
set -g focus-events on

# default is 500ms, which is the Esc lag felt in nvim
set -s escape-time 10

# 2000 lines of scrollback is not enough to find the traceback you scrolled past
set -g history-limit 50000

# after closing window 2 of 1,2,3 leave 1,3 -> renumber to 1,2
set -g renumber-windows on

# --- Keybinds ---

# rebind Prefix from Ctrl+b
unbind C-b
set-option -g prefix C-space

# set vi/vim keybinds
set -g mode-keys vi
set -g status-keys vi

# split panes using | and -
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# unbind arrow keys for navigation
unbind Up     
unbind Down   
unbind Left   
unbind Right  

unbind C-Up   
unbind C-Down 
unbind C-Left 
unbind C-Right

#vim-like pane resizing  
bind -r C-k resize-pane -U
bind -r C-j resize-pane -D
bind -r C-h resize-pane -L
bind -r C-l resize-pane -R

# vim-like pane switching
bind -n C-k select-pane -U 
bind -n C-j select-pane -D 
bind -n C-h select-pane -L 
bind -n C-l select-pane -R 

# set mouse copying behavior
unbind -Tcopy-mode MouseDragEnd1Pane
bind -Tcopy-mode MouseDragEnd1Pane send -X copy-selection
bind -Tcopy-mode MouseDragEnd1Pane send -X copy-selection-no-clear

# copy/paste functionality with wl-clipboard (default)
bind C-c run "tmux save-buffer - | wl-copy"
bind C-v run "tmux set-buffer \"\$(wl-paste)\"; tmux paste-buffer"

# copy/paste functionality with xclip (legacy)
#bind C-c run "tmux save-buffer - | xclip -i -sel clipboard"
#bind C-v run "tmux set-buffer \"$(xclip -o -sel clipboard)\"; tmux paste-buffer"

# reload config file
bind r source-file ~/.tmux.conf \; display "Reloaded ~/.tmux.conf"

# uncomment to set powerline bindings
#source /usr/share/powerline/bindings/tmux/powerline.conf

