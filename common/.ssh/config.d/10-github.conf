# GitHub over SSH, as a general dev QoL default.
#
# Included by ~/.ssh/config, which is only:
#     Include config.d/*.conf
#
# Note this fragment is the easy third of "SSH works with GitHub". The other
# two -- having the key, and having its public half registered on the account
# -- cannot live in a public repo and stay manual on a new machine.

Host github.com
    # This machine has global IPv6 addresses but no working IPv6 path to
    # github.com: `curl -6 https://github.com` fails where `-4` returns 200.
    # Without this, ssh resolves AAAA first and stalls before falling back.
    # Drop this line on a machine with working IPv6.
    AddressFamily inet

    # GitHub accepts publickey only, so don't bother offering anything else.
    PreferredAuthentications publickey

    # Use this key, and only this key. IdentitiesOnly matters because the agent
    # holds more than one identity here; without it ssh offers each in turn and
    # can exhaust MaxAuthTries before reaching the one GitHub accepts.
    IdentityFile ~/.ssh/id_ed25519
    IdentitiesOnly yes

    # HostName is deliberately absent: under a literal `Host github.com` it
    # already defaults to the pattern itself, so setting it is a no-op.
